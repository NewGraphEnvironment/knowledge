url: https://newgraphenvironment.github.io/knowledge/
template:
  bootstrap: 5

reference:
  - title: Habitat evidence
    desc: >
      Read and validate the cited literature evidence and the intrinsic-potential
      model registry, and list their controlled vocabularies.
    contents:
      - knw_literature_read
      - knw_literature_vocab
      - knw_ip_read
      - knw_ip_vocab
  - title: Life-history timing
    contents:
      - knw_timing_read
      - knw_timing_stages
  - title: Fish records
    contents:
      - knw_size_class
      - knw_species
      - knw_fdis_place
      - knw_fdis_quality
      - knw_fdis_species
      - knw_spawner_evidence
      - knw_fiss_visits
      - knw_bcfishobs_match
  - title: Evidence on link's segments
    desc: >
      Place site visits on link's segments with every species' access and habitat flags; read a
      species' segments, flow, width, regulated reaches, natural barriers downstream and the walks to
      rivers; count where link's two access columns disagree; carry each segment's minimal-network parent;
      and check that a database-bound run is on the database's host.
    contents:
      - knw_link_place
      - knw_parent_join
      - knw_link_segments
      - knw_link_flow
      - knw_link_width
      - knw_link_regulated
      - knw_link_barrier_dnstr
      - knw_link_walks
      - knw_walk_md5
      - knw_discharge_load
      - knw_build_record
      - knw_db_latency
      - knw_db_latency_check
      - knw_link_access_check
  - title: Tuning
    desc: >
      Build candidate rules around link's thresholds and score them on held-out watershed groups, fit
      the joint use curve at the pick, and grade every segment by expected use. The building, scoring and
      fitting run in one call for every species and stage the evidence can speak to.
    contents:
      - knw_tune_grid
      - knw_walk_index
      - knw_rule_in
      - knw_tune_score
      - knw_tune_repick
      - knw_tune_pick_report
      - knw_tune_curve
      - knw_grade
      - knw_grade_species
      - knw_tune_smoke
      - knw_tune_run
  - title: Published results and comparison
    contents:
      - knw_thresholds_table
      - knw_tune_promote
      - knw_grade_record_write
      - knw_archive_setup
      - knw_archive_plan
      - knw_archive_put
      - knw_archive_pull
      - knw_archive_undo
      - knw_archive_index_read
      - knw_site_gradient_visits
      - knw_run_ledger
      - knw_publish
      - knw_compare_rules
      - knw_floodplain_ha
      - knw_compare_map
      - knw_compare_mapgl
  - title: Crossings and past reports
    desc: >
      Pull PSCIS crossing layers for a watershed group and derive the crossing
      and past-report tables; check stream names before searching by name.
    contents:
      - knw_pscis_layers
      - knw_pscis_pull
      - knw_pscis_crossings
      - knw_pscis_reports
      - knw_gnis_collisions
  - title: Package
    contents:
      - knowledge-package
