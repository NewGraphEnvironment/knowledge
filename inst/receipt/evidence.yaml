# The receipt declaration for an evidence build, the tables scripts/0310 writes into its evidence directory (#160),
# read by crate::crt_receipt_keys() through knw_receipt_keys("evidence"). knw_evidence_receipt_write() supplies exactly
# these names; crate computes the ids.
#
# This is the rule the provenance track started from, written down: every table must come back exactly, except
# access_check's km, which may move by a rounding. Each km is a sum over up to tens of thousands of segments (72,617
# at most), which a database may take in another order: the rounding is 1e-6 km (1 mm), the tolerance #158's hand
# comparison used. Measured rebuilds of the published build's evidence moved access_check by 9.5e-11 km (#154's, on
# one database), 1.0e-10 km at most (#160's two on one database), 6.0e-11 km (#158's second database) and 5.3e-11 km
# (#165's two at one commit on two databases, every other table with the same values and one recipe_id, so
# `equivalent` on the receipts alone and with the tables re-read). That pair also confirmed #161's fix: visits_link's
# mad_pick, which moved on 3 visits in #158 through the tie, came back the same. Two tables' bytes still differ
# between databases, the species columns' order (#197); crate fingerprints a table by column name, so the evidence
# verdict does not move (the md5s downstream do: thresholds.yaml). crate rounds a value to the tolerance's decimals,
# so a comparison of receipts alone can read a value on either side of a rounding edge as different; compare with
# the tables re-read (crt_receipt_compare(tables =)) for the verdict.
receipt_keys: 1
output: evidence
recipe:
  # the method's register and the walk every visit's walks were made with
  config_files: [inst/method/settings.csv, inst/sql/ch_dist_profile.sql]
  # the species built, the walks' river sizes and flow sources, the placement limits 0230 placed with (its
  # reconcile.csv) and the parent source the flows fell back on (PARENT=TRUE, PARENT_DIR=, or none)
  settings: [species, q_grid, sources, snap_limit_m, snap_limit_code_m, parent]
  inputs:
    # link's build (the run log_recompute names), wet's flow load (the table comment), and the installed link whose
    # default bundle decides each species' range and pooling
    - link_build
    - flow
    - link_configs
    # the FDIS extract as received (its MANIFEST.md5) and 0230's load and placement of it, which 0310 reads
    - fdis_export
    - fdis_sites
    - fdis_catch
    - fdis_fish
    # the tracked tables 0310 reads: species codes, size classes, the FISS workbook evidence and its workbooks
    - fdis_species_codes
    - fdis_size_breaks
    - fiss_evidence
    - fiss_workbooks
    # the hydrologic zones as downloaded, and bcfishobs, read live from the database with no version to name
    - hydrologic_zones
    - bcfishobs
  seed: false
result:
  tables:
    visits_link: {}
    visits_species: {}
    walks: {}
    bcfishobs_fdis_match: {}
    access_check:
      tolerance: {km: 1.0e-6}
    workbook_sites: {}
    workbook_species: {}
  summary:
    # placed visits, and access_check's km summed
    visits: {}
    access_km: {tolerance: 1.0e-3}
