# The receipt declaration for a grade table, data/tune/<key>_grades.csv (#154), read by crate::crt_receipt_keys()
# through knw_receipt_keys("grade"). knw_grade_receipt_write() supplies exactly these names; crate computes the ids.
#
# The tolerances rest on a measured rebuild (#165): chinook rearing regraded at one commit on two databases holding the
# published build, each on its own evidence build, gave one recipe_id and identical receipts, every summary equal bit
# for bit (#158's `different` there was #161's parent-flow tie, fixed since). Every walk came from each database's
# cache, so #162's cold walks, which can still differ between databases, were not exercised. crate compares a summary as
# a band, |a - b| <= tolerance, so a sum gets the smallest power of ten strictly above the float error a sum of its size
# can carry when a database returns its rows in another order: n x machine epsilon x the sum of absolute values,
# 2.7e-4 for the largest key's graded km and grade sum (BT rearing, 2.1 million graded segments), against 8e-8 seen
# over four orders (data-raw/grade_order_bound.R). One declaration serves every key, though only chinook was regraded
# on both databases; the counts are exact.
receipt_keys: 1
output: grade
recipe:
  # the walk the grade reads (knw_walk_md5() hashes the same file) and the method's register
  config_files: [inst/method/settings.csv, inst/sql/ch_dist_profile.sql]
  # the run's resolved settings: the key, the score's settings (R/tune_run.R's `spec`, less its seed and evidence,
  # which are the recipe's seed and inputs) and the floors
  settings: [species_code, stage, fit, prior_sd, folds, min_wsg, d_floor, extra, gradient]
  # link's build (the run log_recompute names), wet's flow load (the table comment) and the evidence build: its
  # receipt's recipe_id (#160), so an evidence rebuild that came out equivalent is the same input, or the visit tables'
  # md5s (evidence_md5) as a version id for a build from before evidence receipts. Receipts written before #160 named
  # the three visit tables by their sha256 instead
  inputs: [link_build, flow, evidence]
  seed: true
result:
  tables:
    # what the fit and the grade decided, from the record's constant columns: the pick, the reference edges, the
    # walk's river size, the gate's verdict and its number (written to four decimals, so held to them: crate rounds a
    # table's cells to the tolerance's decimals, and a change in the fourth decimal reads `different`)
    pick:
      tolerance: {null_heldout_curve: 1.0e-4}
  summary:
    rows: {}
    graded_rows: {}
    # km of graded segments and the sum of their grades (each grade written to five significant figures, so one
    # grade rounded the other way moves the sum by up to 1e-5, inside the rounding)
    km_graded: {tolerance: 1.0e-3}
    grade_sum: {tolerance: 1.0e-3}
register:
  # the grade table is 0.3 to 2.5 GB, too large to fingerprint, so the verdict rests on the pick and the summaries: a
  # rebuild that sums in another order moves the bytes and nothing a reader decides on. A moved table is listed as a
  # warning, and the verdict stays identical when the pick and summaries agree exactly
  result.parts.*.bytes: warn
  result.parts.*.sha256: warn
