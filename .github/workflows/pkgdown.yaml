# Not New Graph Environment's shared workflow (NewGraphEnvironment/flows): it fails the build when a draft article reaches the site.
# Its runner is pinned like the shared ones; move it by hand when they move.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-24.04
    # A stalled setup step (an apt mirror, a package compiling from source) otherwise holds the job for 6 h (#94); 40 leaves
    # room for one second try of a setup step below (#159)
    timeout-minutes: 40
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Every stalled run so far (8 runs on 3 days, 2026-11-05 to 2026-11-11, #159) hung here or in the next step, apt failing to
      # resolve the Ubuntu mirror until the job's cap. Each setup step gets a limit and one second try, so a stall costs
      # minutes. The limits sit above the slowest of 25 healthy runs to 2026-11-12: setup-r 233 s, the dependencies 624 s
      # (a cache miss). apt itself gives up on a dead connection and retries first (NewGraphEnvironment/flows#3).
      - name: Make apt retry a stalled mirror
        run: echo 'Acquire::Retries "3"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries

      - uses: r-lib/actions/setup-r@v2
        id: setup_r
        continue-on-error: true
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - name: Set up R, second try
        if: steps.setup_r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        timeout-minutes: 8
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        id: setup_deps
        continue-on-error: true
        timeout-minutes: 15
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Install the dependencies, second try
        if: steps.setup_deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every root-level .md except a hardcoded allowlist
      # (README, LICENSE, NEWS and two templates). CLAUDE.md is not on it and
      # there is no config option to exclude a file, so the site would publish
      # our internal working notes -- including, on a private repo, the
      # conventions the visibility system marks internal-only.
      #
      # Repo visibility does not help: GitHub Pages serves publicly regardless,
      # and there is no private mode below Enterprise Cloud.
      #
      # This removes it from the CI checkout only, never from the repo, and it
      # has to happen BEFORE the build. Deleting afterwards would still leave
      # the verbatim CLAUDE.md copy pkgdown makes and the entry it writes into
      # the full-text search.json index.
      - name: Keep internal notes out of the published site
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}


      # A skip here would be invisible, so assert rather than assume. Any
      # top-level page beyond the ones pkgdown is expected to produce means a
      # root markdown file reached the site -- the exact shape of the leak this
      # workflow exists to prevent, and the shape a future INTERNAL.md would
      # take.
      - name: Fail if an unexpected page reached the site
        run: |
          allowed="404 authors index LICENSE LICENSE-text"
          unexpected=""
          for f in docs/*.html docs/*.md; do
            [ -e "$f" ] || continue
            b=$(basename "$f"); b="${b%.*}"
            case " $allowed " in *" $b "*) ;; *) unexpected="$unexpected $(basename "$f")";; esac
          done
          if [ -n "$unexpected" ]; then
            echo "Unexpected top-level page(s) in docs/:$unexpected"
            echo "pkgdown renders every root .md; remove internal ones before the build."
            exit 1
          fi
          echo "no unexpected top-level pages"

      # A draft article is named vignettes/_<name>.Rmd, which pkgdown skips,
      # until its counts are the ones it should publish (#93). Assert the skip:
      # nothing pkgdown would render from a draft may reach docs/articles/.
      - name: Fail if a draft article reached the site
        run: |
          drafts=""
          for f in vignettes/_*.Rmd; do
            [ -e "$f" ] || continue
            b=$(basename "$f" .Rmd)
            for g in "docs/articles/$b.html" "docs/articles/${b#_}.html"; do
              [ -e "$g" ] && drafts="$drafts $g"
            done
          done
          if [ -n "$drafts" ]; then
            echo "Draft article(s) on the site:$drafts"
            exit 1
          fi
          echo "no draft articles on the site"

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # clean: true so the deployed site equals what the build produced.
          # With clean: false the action never deletes, so removing a file from
          # the repo does not unpublish it -- measured on gq, where
          # task_plan.html and friends were still returning 200 long after the
          # PWF documents left the root. Checked before flipping: no CNAME (the
          # domain comes from the org site repo), no dev/ versioned docs, and
          # the favicon/webmanifest assets are build output rather than
          # hand-added.
          clean: true
          branch: gh-pages
          folder: docs
